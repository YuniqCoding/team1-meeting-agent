<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록 검증 담당</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    padding: 40px 20px 80px;
    background: #ffffff;
    color: #111111;
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.7;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  .notice {
    border: 1px solid #999999;
    padding: 12px 16px;
    margin-bottom: 32px;
    font-size: 15px;
    color: #333333;
  }

  h1 { font-size: 28px; margin: 0 0 8px; font-weight: 700; }
  .sub { margin: 0 0 36px; color: #555555; font-size: 15px; }

  .block { border-top: 1px solid #dddddd; padding-top: 28px; margin-top: 28px; }
  .block:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

  label { display: block; font-weight: 700; margin-bottom: 10px; }
  .hint { color: #666666; font-size: 14px; font-weight: 400; }

  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 180px;
    padding: 12px;
    border: 1px solid #999999;
    background: #ffffff;
    color: #111111;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.6;
    resize: vertical;
  }

  button {
    margin-top: 16px;
    padding: 12px 28px;
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
  }
  button:hover { background: #333333; }

  #result-area { display: none; }
  #result-area h2 { font-size: 20px; margin: 0 0 16px; }
  #result-body { border: 1px solid #dddddd; padding: 20px 24px; }
  #result-body h1 { font-size: 22px; margin: 0 0 16px; }
  #result-body h2 { font-size: 18px; margin: 28px 0 10px; }
  #result-body h2:first-child { margin-top: 0; }
  #result-body ol, #result-body ul { padding-left: 22px; }
  #result-body hr { border: none; border-top: 1px solid #dddddd; margin: 24px 0; }

  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0 20px; font-size: 15px; }
  th, td { border: 1px solid #cccccc; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f4f4f4; font-weight: 700; }
  #status { display: none; margin: 16px 0 0; font-size: 15px; color: #555555; }
  #status.on { display: block; }
  #status.error { color: #b00020; }
  #result-body p { margin: 0 0 12px; }
  #result-body h3 { font-size: 16px; margin: 20px 0 8px; }
  #result-body blockquote {
    margin: 16px 0; padding: 8px 14px;
    border-left: 3px solid #cccccc; color: #555555;
  }
  #result-body code { background: #f4f4f4; padding: 1px 5px; font-size: 15px; }
  button[disabled] { background: #999999; cursor: default; }
</style>
</head>
<body>
<div class="wrap">

  <p class="notice">실제로 담당자를 부릅니다.</p>

  <h1>회의록 검증 담당</h1>
  <p class="sub">회의록 요약과 할 일 목록이 원문과 맞는지 확인합니다.</p>

  <div class="block">
    <label for="input-box">
      확인할 요약과 할 일 목록
      <span class="hint">— 요약본을 그대로 붙여넣으세요.</span>
    </label>
    <textarea id="input-box" placeholder="예) 이번 주 핵심 세 줄 ...&#10;담당자별 할 일 ..."></textarea>
    <button id="run-btn" type="button">확인하기</button>
  </div>

  <p id="status" role="status"></p>

  <div class="block" id="result-area">
    <h2>검증 결과</h2>
    <div id="result-body"></div>
  </div>

</div>

<script>
  var btn = document.getElementById('run-btn');
  var input = document.getElementById('input-box');
  var statusEl = document.getElementById('status');
  var area = document.getElementById('result-area');
  var body = document.getElementById('result-body');

  function say(message, isError) {
    statusEl.textContent = message;
    statusEl.className = message ? (isError ? 'on error' : 'on') : '';
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  // **굵게** 와 `코드` 만 다룬다.
  function inline(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function tableCells(line) {
    return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (cell) {
      return cell.trim();
    });
  }

  /** 담당자가 돌려준 마크다운을 화면용 표·제목·목록으로 바꾼다. */
  function renderMarkdown(md) {
    var lines = String(md).replace(/\r\n/g, '\n').split('\n');
    var out = [];
    var i = 0;

    function isTableLine(line) { return /^\s*\|.*\|\s*$/.test(line); }
    function isDivider(line) { return /^\s*\|[\s:|-]+\|\s*$/.test(line); }

    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      // 표: 머리줄 + 구분줄 + 본문줄들
      if (isTableLine(line) && i + 1 < lines.length && isDivider(lines[i + 1])) {
        var head = tableCells(line);
        i += 2;
        var rows = [];
        while (i < lines.length && isTableLine(lines[i])) { rows.push(tableCells(lines[i])); i++; }
        out.push(
          '<div class="table-scroll"><table><thead><tr>' +
          head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>'
        );
        continue;
      }

      // 가로줄
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      // 제목
      var heading = line.match(/^\s*(#{1,4})\s+(.*)$/);
      if (heading) {
        var level = Math.min(heading[1].length, 3);
        out.push('<h' + level + '>' + inline(heading[2].trim()) + '</h' + level + '>');
        i++;
        continue;
      }

      // 목록 (- 또는 1.)
      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
        var ordered = /^\s*\d+\.\s+/.test(line);
        var items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          items.push('<li>' + inline(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, '')) + '</li>');
          i++;
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }

      // 인용
      if (/^\s*>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          quote.push(inline(lines[i].replace(/^\s*>\s?/, '')));
          i++;
        }
        out.push('<blockquote>' + quote.join('<br>') + '</blockquote>');
        continue;
      }

      // 그 밖은 문단
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(#|>|\||[-*+]\s|\d+\.\s)/.test(lines[i])) {
        para.push(inline(lines[i].trim()));
        i++;
      }
      if (para.length) out.push('<p>' + para.join('<br>') + '</p>');
      else i++;
    }

    return out.join('\n');
  }

  btn.addEventListener('click', async function () {
    var text = input.value.trim();
    if (!text) { say('확인할 글을 먼저 넣어주세요.', true); return; }

    btn.disabled = true;
    area.style.display = 'none';
    body.textContent = '';
    say('부르는 중...');

    try {
      // 열쇠는 call-agent 쪽에서만 씁니다. 이 화면은 글만 넘깁니다.
      var res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || ('요청 실패 (' + res.status + ')'));

      body.innerHTML = renderMarkdown(data.result);
      area.style.display = 'block';
      say('');
      area.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      say('부르지 못했습니다 - ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
